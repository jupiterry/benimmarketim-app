# Google Maps anahtarı repoda tutulmaz. Codemagic > Environment variables'a
# MAPS_API_KEY adıyla (Secure) ekle ve aşağıdaki gruplardan birine koy
# (app_store_credentials, android_keystore_credentials). Tanımlı değilse
# derleme kırılmaz; uygulama haritada OpenStreetMap'e düşer.
workflows:
  # Test için imzasız build (mevcut)
  ios-test-build:
    name: iOS Test Build (Unsigned)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Run tests
        script: flutter test
      - name: Install pods
        script: |
          find . -name "Podfile" -exec dirname {} \; | xargs -n1 -I % sh -c 'cd "%"; pod install'
      - name: Flutter build ipa (Unsigned)
        script: |
          # Hesap onayi gelene kadar imzasiz build aliyoruz
          flutter build ios --release --no-codesign \
            --dart-define=MAPS_API_KEY=$MAPS_API_KEY
    artifacts:
      - "build/ios/iphoneos/*.app"
      - "/tmp/xcodebuild_logs/*.log"
      - "*.dSYM.zip"
    publishing:
      email:
        recipients:
          - benimmarketimmm@gmail.com

  # App Store'a yükleme için imzalı build
  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodeMagic2 # App Store Connect integration adı
    environment:
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials # Codemagic'te oluşturmanız gereken environment group
      vars:
        BUNDLE_ID: "com.jupi.benimmarketim" # iOS projesindeki Bundle ID
        APP_STORE_APPLE_ID: 6755792336 # App Store Connect'teki Benim Marketim Apple ID
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jupi.benimmarketim
    scripts:
      - name: Set up code signing settings
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          echo "Using manually uploaded certificates and profiles"
      - name: Use profiles
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Run tests
        script: flutter test
      - name: Install pods
        script: |
          find . -name "Podfile" -exec dirname {} \; | xargs -n1 -I % sh -c 'cd "%"; pod install'
      - name: Flutter build ipa (Signed)
        script: |
          flutter build ipa --release \
            --dart-define=MAPS_API_KEY=$MAPS_API_KEY \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - benimmarketimmm@gmail.com
      app_store_connect:
        auth: integration
        
        # İLK ÖNCE TESTFLIGHT'A YÜKLEYİN (önerilir)
        submit_to_testflight: true
        
        # App Store'a otomatik gönderme (isteğe bağlı)
        # submit_to_app_store: true

  # Google Play için imzalı Android App Bundle
  android-release:
    name: Android Release (Play Store)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.2
      groups:
        # Codemagic'te oluşturulacak environment group. İçinde:
        #   CM_KEYSTORE          (base64 kodlu .jks)
        #   CM_KEYSTORE_PASSWORD
        #   CM_KEY_ALIAS
        #   CM_KEY_PASSWORD
        - android_keystore_credentials
      vars:
        PACKAGE_NAME: "com.jupi.benimapp.benimmarketim_app"
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Set up key.properties
        script: |
          # Keystore ve key.properties yalnızca derleme makinesinde oluşturulur;
          # build.gradle.kts dosya yoksa debug imzasına düşer (mağaza için uygun değil).
          echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/keystore.jks
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_BUILD_DIR/keystore.jks
          EOF
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Run tests
        script: flutter test
      - name: Flutter build appbundle (Signed)
        script: |
          flutter build appbundle --release \
            --dart-define=MAPS_API_KEY=$MAPS_API_KEY
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - benimmarketimmm@gmail.com
      # Play Console'a otomatik yükleme için Codemagic'te Google Play
      # entegrasyonu (servis hesabı JSON'u) tanımlandıktan sonra açın:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
